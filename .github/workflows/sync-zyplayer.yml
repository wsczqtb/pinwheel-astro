name: Sync ZYPlayer articles

on:
  repository_dispatch:
    types: [zyplayer_publish]
  workflow_dispatch:
    inputs:
      page_id:
        description: ZYPlayer page ID
        required: true
      space_id:
        description: ZYPlayer space ID
        required: true

permissions:
  contents: write

concurrency:
  group: zyplayer-sync-${{ github.event.client_payload.pageId || inputs.page_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: python -m pip install --disable-pip-version-check requests pycryptodome oss2

      - name: Sync article from ZYPlayer
        env:
          ZYPLAYER_BASE_URL: ${{ secrets.ZYPLAYER_BASE_URL }}
          ZYPLAYER_RSA_PRIVATE_KEY: ${{ secrets.ZYPLAYER_RSA_PRIVATE_KEY }}
          ZYPLAYER_SPACE_ID: ${{ secrets.ZYPLAYER_SPACE_ID }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PUBLIC_URL: ${{ secrets.OSS_PUBLIC_URL }}
        run: python scripts/zyplayer_sync.py

      - name: Build site
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build

      - name: Commit article index
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- src/data/remote-posts.json; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/remote-posts.json
          git commit -m "Update ZYPlayer article index"
          git push
